<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سِين | دليل التغيير</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b131f; 
            --card-bg: #152132; 
            --accent-color: #e2a855; 
            --accent-hover: #c68e39;
            --telegram-color: #24A1DE;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* تأثير الخلفية الحية الفخمة */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(226, 168, 85, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(226, 168, 85, 0.04) 0%, transparent 50%);
            animation: moveGlow 15s infinite alternate linear;
        }

        @keyframes moveGlow {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        /* حركة دخول الكرت المتدرجة */
        .card {
            background-color: var(--card-bg);
            padding: 50px 35px;
            border-radius: 32px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            margin-bottom: 25px;
        }

        .logo-text {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent-color);
            line-height: 1;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(226, 168, 85, 0.2);
            margin-bottom: 5px;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.9; }
        }

        .badge {
            background-color: rgba(226, 168, 85, 0.1);
            color: var(--accent-color);
            padding: 5px 15px;
            border-radius: 50px

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سين | كتاب ترك العادة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b131f; /* كحلي داكن وفخم متناسق مع هوية الكتاب */
            --card-bg: #152132; /* خلفية الكرت داخلية */
            --accent-color: #e2a855; /* لون ذهبي هادئ ومريح */
            --accent-hover: #c68e39;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* لمسة جمالية في الخلفية */
        body::before {
            content: "";
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(226, 168, 85, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            margin: auto;
        }

        .card {
            background-color: var(--card-bg);
            padding: 45px 30px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(226, 168, 85, 0.08);
        }

        .logo-area {
            margin-bottom: 25px;
        }

        .logo-text {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent-color);
            line-height: 1;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .badge {
            background-color: rgba(226, 168, 85, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(to left, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 16px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0b131f;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(226, 168, 85, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* متجاوب مع الجوال */
        @media (max-width: 480px) {
            .card {
                padding: 35px 20px;
            }
            h1 {
                font-size: 1.7rem;
            }
            p.description {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <div class="logo-area">
                <div class="logo-text">سِين</div>
                <span class="badge">إصدار 1447 - 2026 م</span>
            </div>
            
            <h1>دليلك العملي لترك العادة</h1>
            
            <p class="description">
                كتاب مخصص يساعدك من البداية لخطوة التغيير الحقيقي بأساليب عملية، عبادات، وحلول واقعية لاستعادة نقاء عقلك وحياتك.
            </p>

            <div class="btn-container">
                <a href="seen-book.pdf" target="_blank" class="btn btn-primary">
                    📖 قراءة الكتيب الآن
                </a>
                
                <a href="seen-book.pdf" download="كتاب_سين_لترك_العادة.pdf" class="btn btn-secondary">
                    📥 تحميل الملف (PDF)
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>الدال على الخير كفاعله | ساهم في نشر هذا العمل المبارك</p>
    </footer>

</body>
</html>

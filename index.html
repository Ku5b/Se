<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بداية جديدة | رحلة التعافي والسمو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d; /* أسود فاخر وعميق */
            background-image: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية الموقع بتصميم فخم */
        .container {
            background-color: #141414;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            position: relative;
            /* إطار داخلي مطرز بالذهبي الخافت */
            border: 2px solid #d4af37;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(212, 175, 55, 0.1);
        }

        /* تفاصيل التطريز في الزوايا */
        .container::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            pointer-events: none;
        }

        /* أيقونة أو شعار علوي للوقار */
        .emblem {
            font-size: 28px;
            color: #d4af37;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* خط فاصل مطرز تحت العنوان */
        .divider {
            height: 1px;
            width: 60%;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 0 auto 25px auto;
        }

        p {
            color: #b3b3b3;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        /* زر تحميل ذهبي فخم وثقيل */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #c5a028 0%, #d4af37 50%, #e5c158 100%);
            color: #0b0b0b;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            background: linear-gradient(135deg, #e5c158 0%, #d4af37 50%, #c5a028 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: #666666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار قمة أو رمز الفخامة والسمو -->
        <div class="emblem">✧</div>
        
        <h1>خطوتك الأولى نحو حياة أسمى</h1>
        <div class="divider"></div>
        
        <p>مرحباً بك في مساحتك الخاصة والآمنة. هذا الموقع صُمم ليرافقك في رحلة التحرر من العادات السلبية، واستعادة نقاء الروح والجسد. لقد أودعنا في هذا الدليل خلاصة الخطوات العمليّة لتبدأ حقبة جديدة تليق بك.</p>
        
        <!-- زر التحميل المتناسق مع التصميم الأسود والذهبي -->
        <a href="guide.pdf" class="btn" download>تحميل الدليل الإرشادي الفاخر</a>

        <footer>مساحة آمنة ومغلقة للتغيير وبناء الذات</footer>
    </div>

</body>
</html>

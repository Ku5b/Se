<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سِين | دليل التغيير</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b131f; 
            --card-bg: #152132; 
            --accent-color: #e2a855; 
            --accent-hover: #c68e39;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* لمنع ظهور شريط التمرير أثناء الحركة */
            position: relative;
        }

        /* تأثير الخلفية المتحركة (هالات ضوئية هادئة) */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(226, 168, 85, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(226, 168, 85, 0.05) 0%, transparent 50%);
            animation: moveGlow 15s infinite alternate linear;
        }

        @keyframes moveGlow {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        /* حركة دخول الكرت */
        .card {
            background-color: var(--card-bg);
            padding: 50px 35px;
            border-radius: 32px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            margin-bottom: 25px;
            animation: fadeIn 1.5s ease;
        }

        .logo-text {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent-color);
            line-height: 1;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(226, 168, 85, 0.3);
            margin-bottom: 5px;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .badge {
            background-color: rgba(226, 168, 85, 0.1);
            color: var(--accent-color);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 20px;
            animation: fadeIn 2s ease;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 2.2s ease;
        }

        p.description {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 35px;
            animation: fadeIn 2.5s ease;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 3s ease;
        }

        /* تأثيرات الأزرار الحركية */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 30px;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 18px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0b131f;
            box-shadow: 0 10px 25px rgba(226, 168, 85, 0.2);
        }

        .btn-primary:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 35px rgba(226, 168, 85, 0.3);
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeIn 4s forwards;
        }

        /* تخصيص الجوال */
        @media (max-width: 480px) {
            body { overflow-y: auto; justify-content: flex-start; padding-top: 40px; }
            .card { padding: 40px 25px; width: 95%; }
            .logo-text { font-size: 3.2rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="card">
            
            <div class="logo-area">
                <div class="logo-text">سِين</div>
                <span class="badge">دليلك نحو النقاء | 1447 - 2026</span>
            </div>
            
            <h1>خطوتك الأولى نحو الحرية</h1>
            
            <p class="description">
                "سين" هو رفيقك في رحلة التغيير، كتاب مخصص ليساعدك بأساليب عملية كـ (السباحة بالماء البارد) والتقرب للّٰه لتستعيد طاقتك وحياتك من جديد.
            </p>

            <div class="btn-container">
                <a href="1447%20-%202026.pdf" target="_blank" class="btn btn-primary">
                    <span>📖</span> قراءة الكتاب الآن
                </a>
                
                <a href="1447%20-%202026.pdf" download="1447 - 2026.pdf" class="btn btn-secondary">
                    <span>📥</span> تحميل نسخة الـ PDF
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>مُبادرة مباركة | الدال على الخير كفاعله</p>
    </footer>

</body>
</html>

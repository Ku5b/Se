<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي مع تأثيرات حركية</title>
    
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
        /* تنسيقات أساسية بسيطة لتنظيم الصفحة */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214; /* خلفية داكنة تناسب صفحات GitHub */
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .scroll-hint {
            color: #888;
            margin-top: 20px;
            font-size: 1.1rem;
        }

        .content-section {
            padding: 50px 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        /* تصميم البطاقات أو الصناديق التي ستتحرك */
        .card {
            background-color: #1a1a1e;
            border: 1px solid #2f2f35;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        /* تأثير بسيط بالـ CSS عند مرور الماوس على البطاقة */
        .card:hover {
            transform: scale(1.02);
            border-color: #00d4ff;
        }

        .card h3 {
            color: #00d4ff;
            margin-top: 0;
        }

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سين | رحلة التعافي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808; /* أسود مطفي حديث */
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* حاوية الموقع - أسلوب زجاجي مودرن */
        .container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 45px 35px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* تأثير توهج خلفي ناعم للمودرن */
        .container::before {
            content: "";
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* شعار سين - خط عصري وبسيط */
        .emblem {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .main-desc {
            color: #a0a0a0;
            font-size: 14.5px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* زر تحميل مودرن - كبسولة ملساء */
        .btn {
            display: inline-block;
            background-color: #ffffff; /* أبيض ناصع للمودرن */
            color: #000000;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 50px; /* كبسولة */
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            width: 100%; /* يأخذ العرض كامل بشكل كبسة عصرية */
        }

        .btn:hover {
            background-color: #d4af37; /* يتحول للذهبي بسلاسة */
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }
